notes: >-
  Sentry exposes a public RFC 8414 OAuth 2.0 authorization-server document declaring PKCE (S256),
  authorization_code + refresh_token grants, and 25 scopes. The api-catalog linkset advertises both the
  REST API (https://sentry.io/api/0/) and the remote MCP server (https://mcp.sentry.dev/mcp).
  2026-09-18 re-probe added the MCP host mcp.sentry.dev, which serves its OWN RFC 8414
  authorization-server metadata (with a registration_endpoint — RFC 7591 dynamic client
  registration) and an RFC 9728 protected-resource document at the resource-suffixed path
  /.well-known/oauth-protected-resource/mcp. The bare /.well-known/oauth-protected-resource path 404s;
  only the suffixed form is served. docs.sentry.io serves no /.well-known documents (its 404s return
  the docs SPA shell, not a document).
