        name: updatedataforwarder
        description: Sentry Update a data forwarder for an organization
        call: sentry-integrations-data-forwarders.updatedataforwarder
        with:
          forwarder_id: rest.forwarder_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
