    - path: /v1/projects/{organization-id-or-slug}/{project-id-or-slug}/issues
      name: projects-organization-id-or-slug-project-id-or-slug-issues
      description: REST surface for projects-organization_id_or_slug-project_id_or_slug-issues.
      operations:
      - method: GET
        name: listprojectissues
        description: Sentry List a project's issues
        call: sentry-events-issues-issues.listprojectissues
        with:
          query: rest.query
          cursor: rest.cursor
          statsPeriod: rest.statsPeriod
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: bulkmutateprojectissues
        description: Sentry Bulk mutate a list of issues
        call: sentry-events-issues-issues.bulkmutateprojectissues
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: bulkremoveprojectissues
        description: Sentry Bulk remove a list of issues
        call: sentry-events-issues-issues.bulkremoveprojectissues
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sentry-events-issues-issues-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sentry Events and Issues API — Issues. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
