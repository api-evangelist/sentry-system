naftiko: 1.0.0-alpha2
info:
  label: Sentry Events and Issues API — Issues
  description: 'Sentry Events and Issues API — Issues. 12 operations. Lead operation: Sentry Retrieve an issue. Self-contained
    Naftiko capability covering one Sentry System business surface.'
  tags:
  - Sentry System
  - Issues
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENTRY_SYSTEM_API_KEY: SENTRY_SYSTEM_API_KEY
capability:
  consumes:
  - type: http
    namespace: sentry-events-issues-issues
    baseUri: https://sentry.io/api/0
    description: Sentry Events and Issues API — Issues business capability. Self-contained, no shared references.
    resources:
    - name: issues-issue_id
      path: /issues/{issue_id}/
      operations:
      - name: retrieveissue
        method: GET
        description: Sentry Retrieve an issue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateissue
        method: PUT
        description: Sentry Update an issue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: removeissue
        method: DELETE
        description: Sentry Remove an issue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: issues-issue_id-hashes
      path: /issues/{issue_id}/hashes/
      operations:
      - name: listissuehashes
        method: GET
        description: Sentry List an issue's hashes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cursor
          in: query
          type: string
          description: Pagination cursor.
    - name: issues-issue_id-tags-key
      path: /issues/{issue_id}/tags/{key}/
      operations:
      - name: retrieveissuetagdetails
        method: GET
        description: Sentry Retrieve tag details for an issue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          description: The tag key to look up.
          required: true
    - name: issues-issue_id-tags-key-values
      path: /issues/{issue_id}/tags/{key}/values/
      operations:
      - name: listissuetagvalues
        method: GET
        description: Sentry List a tag's values for an issue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          description: The tag key to look up.
          required: true
    - name: organizations-organization_id_or_slug-issues
      path: /organizations/{organization_id_or_slug}/issues/
      operations:
      - name: listorganizationissues
        method: GET
        description: Sentry List an organization's issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: An optional Sentry structured search query.
        - name: cursor
          in: query
          type: string
          description: A pointer to the last object fetched and its sort order for pagination.
        - name: statsPeriod
          in: query
          type: string
          description: An optional stat period (can be one of 24h, 14d, or empty string).
        - name: shortIdLookup
          in: query
          type: boolean
          description: If this is set to true then short IDs are looked up by this criteria.
      - name: bulkmutateorganizationissues
        method: PUT
        description: Sentry Bulk mutate an organization's issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: array
          description: A list of IDs of the issues to be mutated.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: bulkremoveorganizationissues
        method: DELETE
        description: Sentry Bulk remove an organization's issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: array
          description: A list of IDs of the issues to be removed.
    - name: projects-organization_id_or_slug-project_id_or_slug-issues
      path: /projects/{organization_id_or_slug}/{project_id_or_slug}/issues/
      operations:
      - name: listprojectissues
        method: GET
        description: Sentry List a project's issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: An optional Sentry structured search query.
        - name: cursor
          in: query
          type: string
          description: Pagination cursor.
        - name: statsPeriod
          in: query
          type: string
          description: An optional stat period.
      - name: bulkmutateprojectissues
        method: PUT
        description: Sentry Bulk mutate a list of issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: array
          description: A list of IDs of the issues to be mutated.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: bulkremoveprojectissues
        method: DELETE
        description: Sentry Bulk remove a list of issues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: array
          description: A list of IDs of the issues to be removed.
    authentication:
      type: bearer
      token: '{{env.SENTRY_SYSTEM_API_KEY}}'
