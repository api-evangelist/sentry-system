naftiko: 1.0.0-alpha2
info:
  label: Sentry SCIM API — SCIM Members
  description: 'Sentry SCIM API — SCIM Members. 5 operations. Lead operation: Sentry List an organization''s SCIM members.
    Self-contained Naftiko capability covering one Sentry System business surface.'
  tags:
  - Sentry System
  - SCIM Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENTRY_SYSTEM_API_KEY: SENTRY_SYSTEM_API_KEY
capability:
  consumes:
  - type: http
    namespace: sentry-scim-scim-members
    baseUri: https://sentry.io/api/0
    description: Sentry SCIM API — SCIM Members business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_id_or_slug-scim-v2-Users
      path: /organizations/{organization_id_or_slug}/scim/v2/Users
      operations:
      - name: listscimmembers
        method: GET
        description: Sentry List an organization's SCIM members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startIndex
          in: query
          type: integer
          description: SCIM 1-indexed starting result number.
        - name: count
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: filter
          in: query
          type: string
          description: SCIM filter expression (e.g., userName eq "user@example.com").
      - name: provisionscimmember
        method: POST
        description: Sentry Provision a new organization member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: organizations-organization_id_or_slug-scim-v2-Users-scim_user_id
      path: /organizations/{organization_id_or_slug}/scim/v2/Users/{scim_user_id}
      operations:
      - name: queryscimmember
        method: GET
        description: Sentry Query an individual organization member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatescimmember
        method: PATCH
        description: Sentry Update an organization member's attributes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletescimmember
        method: DELETE
        description: Sentry Delete an organization member via SCIM
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SENTRY_SYSTEM_API_KEY}}'
  exposes:
  - type: rest
    namespace: sentry-scim-scim-members-rest
    port: 8080
    description: REST adapter for Sentry SCIM API — SCIM Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/organizations/{organization-id-or-slug}/scim/v2/users
      name: organizations-organization-id-or-slug-scim-v2-users
      description: REST surface for organizations-organization_id_or_slug-scim-v2-Users.
      operations:
      - method: GET
        name: listscimmembers
        description: Sentry List an organization's SCIM members
        call: sentry-scim-scim-members.listscimmembers
        with:
          startIndex: rest.startIndex
          count: rest.count
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: provisionscimmember
        description: Sentry Provision a new organization member
        call: sentry-scim-scim-members.provisionscimmember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations/{organization-id-or-slug}/scim/v2/users/{scim-user-id}
      name: organizations-organization-id-or-slug-scim-v2-users-scim-user-id
      description: REST surface for organizations-organization_id_or_slug-scim-v2-Users-scim_user_id.
      operations:
      - method: GET
        name: queryscimmember
        description: Sentry Query an individual organization member
        call: sentry-scim-scim-members.queryscimmember
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatescimmember
        description: Sentry Update an organization member's attributes
        call: sentry-scim-scim-members.updatescimmember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletescimmember
        description: Sentry Delete an organization member via SCIM
        call: sentry-scim-scim-members.deletescimmember
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sentry-scim-scim-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sentry SCIM API — SCIM Members. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: sentry-list-organization-s-scim-members
      description: Sentry List an organization's SCIM members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sentry-scim-scim-members.listscimmembers
      with:
        startIndex: tools.startIndex
        count: tools.count
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: sentry-provision-new-organization-member
      description: Sentry Provision a new organization member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sentry-scim-scim-members.provisionscimmember
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: sentry-query-individual-organization-member
      description: Sentry Query an individual organization member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sentry-scim-scim-members.queryscimmember
      outputParameters:
      - type: object
        mapping: $.
    - name: sentry-update-organization-member-s-attributes
      description: Sentry Update an organization member's attributes
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sentry-scim-scim-members.updatescimmember
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: sentry-delete-organization-member-scim
      description: Sentry Delete an organization member via SCIM
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: sentry-scim-scim-members.deletescimmember
      outputParameters:
      - type: object
        mapping: $.
