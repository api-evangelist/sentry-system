naftiko: 1.0.0-alpha2
info:
  label: Sentry Releases API — Commits
  description: 'Sentry Releases API — Commits. 2 operations. Lead operation: Sentry Retrieve files changed in a release''s
    commits. Self-contained Naftiko capability covering one Sentry System business surface.'
  tags:
  - Sentry System
  - Commits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENTRY_SYSTEM_API_KEY: SENTRY_SYSTEM_API_KEY
capability:
  consumes:
  - type: http
    namespace: sentry-releases-commits
    baseUri: https://sentry.io/api/0
    description: Sentry Releases API — Commits business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_id_or_slug-releases-version-commitfiles
      path: /organizations/{organization_id_or_slug}/releases/{version}/commitfiles/
      operations:
      - name: listreleasecommitfiles
        method: GET
        description: Sentry Retrieve files changed in a release's commits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cursor
          in: query
          type: string
          description: Pagination cursor.
    - name: organizations-organization_id_or_slug-releases-version-commits
      path: /organizations/{organization_id_or_slug}/releases/{version}/commits/
      operations:
      - name: listorganizationreleasecommits
        method: GET
        description: Sentry List an organization release's commits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cursor
          in: query
          type: string
          description: Pagination cursor.
    authentication:
      type: bearer
      token: '{{env.SENTRY_SYSTEM_API_KEY}}'
  exposes:
  - type: rest
    namespace: sentry-releases-commits-rest
    port: 8080
    description: REST adapter for Sentry Releases API — Commits. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/organizations/{organization-id-or-slug}/releases/{version}/commitfiles
      name: organizations-organization-id-or-slug-releases-version-commitfiles
      description: REST surface for organizations-organization_id_or_slug-releases-version-commitfiles.
      operations:
      - method: GET
        name: listreleasecommitfiles
        description: Sentry Retrieve files changed in a release's commits
        call: sentry-releases-commits.listreleasecommitfiles
        with:
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations/{organization-id-or-slug}/releases/{version}/commits
      name: organizations-organization-id-or-slug-releases-version-commits
      description: REST surface for organizations-organization_id_or_slug-releases-version-commits.
      operations:
      - method: GET
        name: listorganizationreleasecommits
        description: Sentry List an organization release's commits
        call: sentry-releases-commits.listorganizationreleasecommits
        with:
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sentry-releases-commits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sentry Releases API — Commits. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: sentry-retrieve-files-changed-release-s
      description: Sentry Retrieve files changed in a release's commits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sentry-releases-commits.listreleasecommitfiles
      with:
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: sentry-list-organization-release-s-commits
      description: Sentry List an organization release's commits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sentry-releases-commits.listorganizationreleasecommits
      with:
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
